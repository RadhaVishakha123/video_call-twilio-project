name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Install dependencies
      - run: npm ci

      # Check formatting
      - run: npx nx format:check --base="origin/main"

      # Run lint, test, build, typecheck, e2e
      - run: npx nx run-many -t lint test build typecheck e2e-ci
